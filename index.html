<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-Style Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h2>C-Style Calculator</h2>
        
        <div class="terminal-header">
            [NOTE 1: Enter numbers one by one]<br>
            [NOTE 2: Type 'b' to BACKSPACE / erase]<br>
            [NOTE 3: Type '@' when finished typing numbers]
        </div>

        <!-- PHASE 1: Number Entry Mode -->
        <div id="entryPhase">
            <div class="input-group">
                <label id="inputLabel" for="counterInput">Enter number 1:</label>
                <input type="text" id="counterInput" placeholder="Type number, 'b', or '@'" autocomplete="off">
            </div>
            <button style="width:100%; margin-bottom:15px;" onclick="processInput()">Submit Input</button>
            
            <div class="number-list" id="numberList">
                Array Status: [ Empty ]
            </div>
        </div>

        <!-- PHASE 2: Dynamic Sequence Operation Menu -->
        <div id="operationPhase" class="operator-menu hidden">
            <p id="opInstructions">Starting calculation with: 0.00</p>
            <div class="button-grid">
                <button onclick="applyOperation('+')">+</button>
                <button onclick="applyOperation('-')">-</button>
                <button onclick="applyOperation('*')">*</button>
                <button onclick="applyOperation('/')">/</button>
            </div>
            <button class="exit-btn" onclick="applyOperation('!')">! (Force Stop)</button>
        </div>

        <!-- PHASE 3: Result Action Menu (c, s, e) -->
        <div id="postMenuPhase" class="post-menu-section hidden">
            <p>What do you want to do with the result?</p>
            <div class="control-grid">
                <button onclick="handlePostChoice('c')">'c' Continue</button>
                <button onclick="handlePostChoice('s')">'s' Start Over</button>
            </div>
            <button class="exit-btn" onclick="handlePostChoice('e')">'e' Exit Calculator</button>
        </div>

        <!-- Display Output Box -->
        <div class="output-box">
            <h3>Console Output:</h3>
            <div id="resultDisplay">Enter numbers to get started...</div>
        </div>
    </div>

    <!-- FIXED: This links your HTML directly to your separate JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
